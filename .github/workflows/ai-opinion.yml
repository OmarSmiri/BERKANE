name: AI opinion

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "opinion (started by the bot) or scorecard"
        type: choice
        options: [scorecard, opinion]
        default: scorecard
      items:
        description: "Signals to check (filled in by the bot)"
        type: string
        default: ""
  schedule:
    - cron: "7 17 * * 0"   # weekly scorecard, Sunday evening

concurrency:
  group: ai-opinion
  cancel-in-progress: false

permissions:
  contents: write   # saves data/journal.csv and the AI's memory back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ github.event_name == 'schedule' && 'scorecard' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TradingAgents
        if: env.MODE == 'opinion'
        run: pip install "git+https://github.com/TauricResearch/TradingAgents.git@${{ vars.TA_VERSION || 'v0.7.0' }}"

      - name: Run
        env:
          ITEMS: ${{ inputs.items }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_QUICK_MODEL: ${{ vars.AI_QUICK_MODEL }}
          AI_DEEP_MODEL: ${{ vars.AI_DEEP_MODEL }}
          AI_ANALYSTS: ${{ vars.AI_ANALYSTS }}
          YAHOO_TICKERS: ${{ vars.YAHOO_TICKERS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRADINGAGENTS_NO_UPDATE_CHECK: "1"
        run: python ai_opinion.py

      - name: Keep the full reports (download from this run's page)
        if: always() && env.MODE == 'opinion'
        uses: actions/upload-artifact@v4
        with:
          name: ai-reports
          path: reports
          if-no-files-found: ignore
          retention-days: 30

      - name: Save journal
        if: always()
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add data || true
          if ! git diff --cached --quiet; then
            git commit -m "AI journal update"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
